# On every push to main: tag the version from the newest CHANGELOG entry in
# resources/js/components/HelpModal.tsx (if it isn't tagged yet), publish a GitHub Release
# with that entry's notes, attach the browser-extension zips, then build the Docker image (:edge always; :X.Y.Z, :X.Y and
# :latest for a new version).
#
# The image build is called from here rather than triggered by the tag: tags created with
# GITHUB_TOKEN don't start other workflows.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.changelog.outputs.version }}
      tag: ${{ steps.changelog.outputs.tag }}
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@v4

      - id: changelog
        run: node .github/scripts/changelog-release.mjs "$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"

      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.changelog.outputs.tag }}
          TITLE: ${{ steps.changelog.outputs.title }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists — nothing to release (bump the version in HelpModal.tsx to cut one)."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG — $TITLE" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "### Released $TAG" >> "$GITHUB_STEP_SUMMARY"

  # Browser extension zips on the current release (stable names, replaced on every push), so
  # https://github.com/<repo>/releases/latest/download/brainitive-extension-chrome.zip works.
  extension:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - run: npm ci
      - run: npm run zip && npm run zip:firefox
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cp dist/*-chrome.zip brainitive-extension-chrome.zip
          cp dist/*-firefox.zip brainitive-extension-firefox.zip
          gh release upload "$TAG" brainitive-extension-chrome.zip brainitive-extension-firefox.zip --clobber

  # The CLI binaries for macOS, Linux and Windows (both architectures) + checksums.txt on the
  # same release, with stable names: https://github.com/<repo>/releases/latest/download/brainitive_<os>_<arch>.tar.gz
  # is what cli/install.sh, install.ps1 and `brainitive update` fetch. Replaced on every push.
  cli:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          check-latest: true # newest patch of that Go line, so stdlib security fixes ship in the binaries
          cache-dependency-path: cli/go.sum
      - run: go test ./...
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            out=brainitive; [ "$os" = windows ] && out=brainitive.exe
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/$out" ./cmd/brainitive
            cp README.md dist/README.md
            if [ "$os" = windows ]; then
              (cd dist && zip -q "brainitive_${os}_${arch}.zip" "$out" README.md)
            else
              tar -czf "dist/brainitive_${os}_${arch}.tar.gz" -C dist "$out" README.md
            fi
            rm -f "dist/$out" dist/README.md
          done
          (cd dist && sha256sum brainitive_* > checksums.txt && cat checksums.txt)
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" dist/brainitive_* dist/checksums.txt --clobber

  docker:
    needs: version
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.version.outputs.released == 'true' && needs.version.outputs.version || '' }}
