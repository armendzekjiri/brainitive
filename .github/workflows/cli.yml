# The Brainitive CLI (cli/): vet, tests and a cross-build on every push that touches it.
# Release binaries are built by release.yml (job `cli`) when a version ships to main.
name: CLI

on:
  push:
    paths: ['cli/**', '.github/workflows/cli.yml']
  pull_request:
    paths: ['cli/**', '.github/workflows/cli.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          check-latest: true # the newest patch of that Go line: stdlib fixes (net/http, crypto/tls) ship in the binary
          cache-dependency-path: cli/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; echo 'run gofmt -w .'; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Known vulnerabilities (stdlib + modules reachable from the CLI)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Cross-build (same targets as the release)
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/brainitive
            echo "built $target"
          done
      - name: Install script parses
        run: sh -n install.sh
