# The test gate (BRAI-95): lint, types, build, PHPUnit on PostgreSQL 16 (as production) and the
# Playwright e2e journeys in Chromium against a fresh, seeded app on Postgres (BRAI-96).
# Runs on every push to a feature branch; deploy.yml calls it before production deploys.
name: Tests

on:
  push:
    branches-ignore: [main, pre-release]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  frontend:
    name: Frontend (types + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: TypeScript (e2e)
        run: npx tsc -p e2e
      # the realtime server for live co-editing (BRAI-54): token + persistence hooks
      - name: Realtime server tests
        run: npm --prefix realtime ci --no-audit --no-fund && npm --prefix realtime test
      - name: Build
        run: npm run build
      # PHPUnit renders Inertia pages, which need the Vite manifest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: public/build
          retention-days: 1

  pint:
    name: Pint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: ./vendor/bin/pint --test

  phpunit:
    name: PHPUnit (PostgreSQL)
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # CI-only throwaway database (credentials exist only inside the runner)
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brainitive
          POSTGRES_PASSWORD: brainitive
          POSTGRES_DB: brainitive_test # phpunit.xml forces this database name
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U brainitive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: brainitive
      DB_PASSWORD: brainitive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, bcmath, zip, fileinfo, sodium, pdo_pgsql
          coverage: none
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: public/build
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - run: php artisan test

  e2e:
    name: E2E (Chromium)
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # CI-only throwaway database (credentials exist only inside the runner)
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brainitive
          POSTGRES_PASSWORD: brainitive
          POSTGRES_DB: testing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U brainitive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # failure videos show a cursor + click ripple (e2e/cursor.ts)
      E2E_SHOW_CURSOR: 1
      E2E_DB_DATABASE: testing
      E2E_DB_USERNAME: brainitive
      E2E_DB_PASSWORD: brainitive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, bcmath, zip, fileinfo, sodium, pdo_pgsql
          coverage: none
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # live-docs.spec.ts starts the realtime server itself (BRAI-54)
      - run: npm --prefix realtime ci --omit=dev --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: public/build
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c e2e --project=chromium
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
