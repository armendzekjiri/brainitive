# Automatic deployment on push to main
# Deploys Laravel app to your server via SSH
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual run from Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Makes GitHub record a deployment, so issues linked via commits show "Deployed to production".
    environment:
      name: production
      url: https://www.brainitive.app
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # SHA256 host key fingerprint (ssh-keyscan -p PORT HOST | ssh-keygen -lf -); empty = not checked
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            echo ">>> Pulling latest code..."
            git pull origin main
            echo ">>> Installing PHP dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction
            echo ">>> Installing Node dependencies and building assets..."
            npm ci
            npm run build
            echo ">>> Running migrations..."
            php artisan migrate --force
            echo ">>> Caching config, routes, views..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize:clear
            echo ">>> Restarting queue workers (if running)..."
            (php artisan queue:restart 2>/dev/null || true)
            echo ">>> Deployment finished."
