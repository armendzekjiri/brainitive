# Nightly cross-browser e2e (BRAI-96): the same Playwright journeys as the per-push Chromium run,
# in Firefox and WebKit (Safari's engine), against a fresh, seeded app on Postgres.
name: E2E nightly

on:
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    services:
      # CI-only throwaway database (credentials exist only inside the runner)
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brainitive
          POSTGRES_PASSWORD: brainitive
          POSTGRES_DB: testing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U brainitive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DB_DATABASE: testing
      E2E_DB_USERNAME: brainitive
      E2E_DB_PASSWORD: brainitive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: pre-release
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, bcmath, zip, fileinfo, sodium, pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix realtime ci --omit=dev --no-audit --no-fund
      - run: npm run build
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      # the login setup project (auth.setup.ts) always runs in Chromium
      - run: npx playwright install --with-deps chromium ${{ matrix.browser }}
      - run: npx playwright test -c e2e --project=${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.browser }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
