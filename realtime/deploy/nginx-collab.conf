# Brainitive live co-editing (BRAI-54): WebSocket of the realtime server on the app's own host.
# Put this inside the app's `server { … }` block (the HTTPS one), then `nginx -t && systemctl reload nginx`.
# The app then needs COLLAB_URL=wss://<host>/collab in its .env (+ `php artisan config:cache`).
# Live channels (BRAI-151) use the same location (wss://<host>/collab?live=1): nothing to add here.
# Never proxy the realtime server's /internal/ paths: the app publishes to it directly with
# LIVE_PUBLISH_URL=http://127.0.0.1:<port> (the server refuses requests that carry proxy headers).
location /collab {
    proxy_pass http://127.0.0.1:1234;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # long-lived connections: the server pings every 30 s
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    # optional, against connection floods (needs `limit_conn_zone $binary_remote_addr zone=collab:10m;`
    # in the http {} block): limit_conn collab 20;
}

# The realtime server stores document state through /api/internal/collab/* on this same host:
# large documents need a body limit above nginx's default 1 MB (state ≤ 16 MB, base64 ≈ 22 MB).
location /api/internal/collab/ {
    client_max_body_size 25m;
    try_files $uri /index.php?$query_string;
}
