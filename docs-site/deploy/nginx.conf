# docs.brainitive.app — static VitePress build (repo: docs-site/, published by .github/workflows/docs.yml).
# Server setup (once): /var/www/brainitive-docs owned by the deploy user, a sparse clone in repo/
# (git clone --filter=blob:none --sparse <repo> repo && git -C repo sparse-checkout set docs-site),
# this file in sites-available + enabled, then certbot --nginx -d docs.brainitive.app --redirect.
# current -> releases/<sha> is switched atomically by each publish.
server {
    listen 80;
    server_name docs.brainitive.app;
    root /var/www/brainitive-docs/current;
    index index.html;
    # releases switch via the current symlink: never serve cached (old or missing) files
    open_file_cache off;

    access_log /var/log/nginx/brainitive-docs.access.log;
    error_log  /var/log/nginx/brainitive-docs.error.log warn;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # clean URLs: /self-hosting/docker -> docker.html, /guide/ -> guide/index.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # hashed bundles never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
