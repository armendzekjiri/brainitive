# Brainitive self-hosting. Quick start: docs/self-hosting.md
#   cp .env.docker.example .env   # then set DB_PASSWORD (and APP_URL, mail)
#   docker compose up -d
x-brainitive: &brainitive
  image: ${BRAINITIVE_IMAGE:-ghcr.io/armendzekjiri/brainitive:latest}
  build: .
  env_file: .env
  restart: unless-stopped
  environment: &environment
    # Fixed by this file (the db service below), whatever an older .env says
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: "5432"
    # Live co-editing (BRAI-54): the browser connects to /collab on this host (Caddy → realtime).
    # COLLAB_URL= (empty) in .env turns it off; then remove the realtime service too.
    COLLAB_URL: ${COLLAB_URL-/collab}
  volumes:
    - storage:/app/storage
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *brainitive
    environment:
      <<: *environment
      CONTAINER_ROLE: app
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config

  queue:
    <<: *brainitive
    environment:
      <<: *environment
      CONTAINER_ROLE: queue
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    # The image's healthcheck probes the web server, which only the app container runs
    healthcheck:
      disable: true

  scheduler:
    <<: *brainitive
    environment:
      <<: *environment
      CONTAINER_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]
    # The image's healthcheck probes the web server, which only the app container runs
    healthcheck:
      disable: true

  # Live co-editing of documents (BRAI-54): several people in one doc, carets, offline merge.
  # Optional: without it documents are edited one person at a time, as before.
  realtime:
    <<: *brainitive
    environment:
      <<: *environment
      CONTAINER_ROLE: realtime
      COLLAB_HOST: 0.0.0.0
      COLLAB_PORT: "1234"
      COLLAB_APP_URL: http://app:8081
    command: ["node", "realtime/src/index.js"]
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1234/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-brainitive}
      POSTGRES_USER: ${DB_USERNAME:-brainitive}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      # Not the old `db` volume: that one may still hold MariaDB files from older versions
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis:/data

volumes:
  storage:
  pgdata:
  redis:
  caddy_data:
  caddy_config:
