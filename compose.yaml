# Brainitive self-hosting. Quick start: docs/self-hosting.md
#   cp .env.docker.example .env   # then set DB_PASSWORD (and APP_URL, mail)
#   docker compose up -d
x-brainitive: &brainitive
  image: ${BRAINITIVE_IMAGE:-ghcr.io/armendzekjiri/brainitive:latest}
  build: .
  env_file: .env
  restart: unless-stopped
  environment: &environment
    # Fixed by this file (the db service below), whatever an older .env says
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: "5432"
  volumes:
    - storage:/app/storage
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *brainitive
    environment:
      <<: *environment
      CONTAINER_ROLE: app
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config

  queue:
    <<: *brainitive
    environment:
      <<: *environment
      CONTAINER_ROLE: queue
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    # The image's healthcheck probes the web server, which only the app container runs
    healthcheck:
      disable: true

  scheduler:
    <<: *brainitive
    environment:
      <<: *environment
      CONTAINER_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]
    # The image's healthcheck probes the web server, which only the app container runs
    healthcheck:
      disable: true

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-brainitive}
      POSTGRES_USER: ${DB_USERNAME:-brainitive}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      # Not the old `db` volume: that one may still hold MariaDB files from older versions
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis:/data

volumes:
  storage:
  pgdata:
  redis:
  caddy_data:
  caddy_config:
