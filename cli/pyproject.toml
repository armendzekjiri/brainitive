[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainitive-cli"
version = "1.0.0"
description = "Beautiful terminal client for Brainitive workspaces"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "questionary>=2.0",
]

[project.scripts]
brainitive = "brainitive_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["brainitive_cli*"]
