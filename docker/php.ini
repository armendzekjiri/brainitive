; Brainitive defaults for the Docker image
memory_limit = 512M
; imports (Notion ZIP, project archives) accept up to 200 MB
upload_max_filesize = 200M
post_max_size = 210M
max_execution_time = 120
expose_php = Off
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; Never print errors into responses (they break headers/status codes); log them instead
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
